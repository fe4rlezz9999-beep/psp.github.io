<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa - Your Perfect Choice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-white py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <a href="/" class="text-decoration-none">
                    <h2 class="fw-bold text-primary m-0" style="color: #0f4396 !important;">Nexa</h2>
                    <small class="text-muted">Your Perfect Choice</small>
                </a>
            </div>
            
            <div class="w-50">
                <form class="d-flex shadow-sm rounded">
                    <input class="form-control border-end-0 rounded-start" type="search" placeholder="Search Product..." aria-label="Search">
                    <button class="btn text-white rounded-end" type="submit" style="background-color: #0f4396; min-width: 100px;">Search</button>
                </form>
            </div>

            <div class="d-flex align-items-center gap-2">
    <i class="fa-regular fa-user fs-4 text-secondary"></i>
    <div style="line-height: 1.2;">
        <small class="text-muted d-block" style="font-size: 11px;">My Account</small>
        <a href="{% url 'login' %}" class="text-dark fw-bold text-decoration-none" style="font-size: 13px;">Login</a>
        <span class="text-muted" style="font-size: 12px;">/</span>
        <a href="{% url 'register' %}" class="text-dark fw-bold text-decoration-none" style="font-size: 13px;">Register</a>
    </div>
</div>
        </div>
    </header>

    <nav class="py-2 shadow-sm" style="background-color: #0f4396;">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-4">
                <a class="nav-link text-white d-flex align-items-center gap-1 fw-medium" href="/">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a class="nav-link text-white d-flex align-items-center gap-1 fw-medium" href="{% url 'product_list' %}">
                    <i class="fa-solid fa-mobile-screen"></i> Product List
                </a>
                <a class="nav-link text-white d-flex align-items-center gap-1 fw-medium" href="{% url 'favourites' %}">
                    <i class="fa-solid fa-heart"></i> Favourites
                </a>
                <a class="nav-link text-white d-flex align-items-center gap-1 fw-medium" href="{% url 'contact' %}">
                    <i class="fa-solid fa-envelope"></i> Contact Us
                </a>
            </div>

            <div class="d-flex align-items-center">
                <a class="nav-link text-white d-flex align-items-center gap-1 fw-medium position-relative" href="#" style="padding: 5px 12px; background-color: rgba(255,255,255,0.15); border-radius: 20px;">
                    <i class="fa-solid fa-cart-shopping"></i> Cart
                    <span class="badge rounded-pill bg-danger ms-1" style="font-size: 10px; padding: 3px 6px;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
